[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "NewsOrchestrator"
version = "0.1.0"
description = "Norwegian news workflow coordinator"
requires-python = ">=3.11"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore[a2a] >= 1.10.0",
    "botocore[crt] >= 1.35.0",
    "strands-agents[a2a] >= 1.13.0",
    "boto3 >= 1.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
