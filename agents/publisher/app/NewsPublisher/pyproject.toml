[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "NewsPublisher"
version = "0.1.0"
description = "General-purpose editorial and publishing agent"
requires-python = ">=3.11"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "strands-agents >= 1.13.0",
    "gitpython >= 3.1.0",
    "jinja2 >= 3.1.0",
    "httpx >= 0.27.0",
    "boto3 >= 1.34.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
