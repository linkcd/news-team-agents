name: Public configuration privacy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check-public-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public files and reachable history
        run: python3 scripts/check_public_config.py --history
